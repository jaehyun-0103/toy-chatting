# 보안 취약점 테스트 (http://localhost:8081/zap/)
  owasp-zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zaproxy
    ports:
      - "8081:8080"
      - "8090:8090"
    user: zap
    entrypoint: ["zap-webswing.sh"]

networks:
  chatting:
    driver: bridge